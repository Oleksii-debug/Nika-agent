name: Extension CI

on:
  push:
    branches:
      - main
      - 'dev/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: extension-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run compile

      - name: Unit tests
        run: npm test

      - name: Build Chrome extension
        run: npm run build
