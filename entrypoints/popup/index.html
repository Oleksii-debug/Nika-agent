<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nika Agent</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Nika Agent</h1>
      <p id="status" role="status" aria-live="polite">Готово.</p>

      <section aria-labelledby="recovery-heading">
        <h2 id="recovery-heading">Потребує перевірки</h2>
        <p id="recovery-summary">Немає завантажених випадків.</p>
        <label for="recovery-select">Випадок</label>
        <select id="recovery-select"></select>
        <div id="recovery-detail" role="region" aria-live="polite" aria-label="Деталі відновлення"></div>
        <label for="recovery-action">Безпечна дія</label>
        <select id="recovery-action"></select>
        <div class="actions">
          <button id="recovery-apply" type="button">Застосувати дію</button>
          <button id="recovery-refresh" type="button">Оновити список</button>
        </div>
      </section>

      <section aria-labelledby="agents-heading">
        <h2 id="agents-heading">Чати</h2>
        <label for="agent-select">Вибрати чат</label>
        <select id="agent-select"></select>
        <div class="actions">
          <button id="run-agent" type="button">Запустити зараз</button>
          <button id="delete-agent" type="button">Видалити</button>
        </div>
      </section>

      <section aria-labelledby="editor-heading">
        <h2 id="editor-heading">Редактор чату</h2>
        <form id="agent-form">
          <input id="agent-id" type="hidden" />
          <label for="agent-name">Назва</label>
          <input id="agent-name" required />

          <label for="agent-url">URL ChatGPT</label>
          <input id="agent-url" type="url" required placeholder="https://chatgpt.com/c/..." />

          <label for="agent-role">Роль</label>
          <select id="agent-role">
            <option value="developer">Розробник</option>
            <option value="auditor">Аудитор</option>
            <option value="coordinator">Координатор</option>
            <option value="researcher">Дослідник</option>
            <option value="custom">Інша</option>
          </select>

          <label for="agent-prompt">Повідомлення за замовчуванням</label>
          <textarea id="agent-prompt" rows="6" required></textarea>

          <label for="schedule-kind">Режим запуску</label>
          <select id="schedule-kind">
            <option value="manual">Лише вручну</option>
            <option value="interval">Через інтервал</option>
          </select>

          <label for="interval-minutes">Інтервал, хвилин</label>
          <input id="interval-minutes" type="number" min="1" value="60" />

          <label class="inline" for="agent-enabled">
            <input id="agent-enabled" type="checkbox" checked />
            Активний чат
          </label>

          <button type="submit">Зберегти чат</button>
          <button id="new-agent" type="button">Новий чат</button>
        </form>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
